name: OCI Instance Retry

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-retry
  cancel-in-progress: false

jobs:
  try-create:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install OCI SDK
        run: pip install oci==2.177.0

      - name: Write key file
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          python3 -c "import os; k=os.environ['OCI_PRIVATE_KEY'].replace('\\\\n','\n'); open('/tmp/oci_key.pem','w').write(k)"
          chmod 600 /tmp/oci_key.pem
          head -1 /tmp/oci_key.pem

      - name: Try to create instance
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SSH_PUBKEY: ${{ secrets.OCI_SSH_PUBKEY }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          python - <<'EOF'
          import oci, os, sys, time, datetime
          import urllib.request, json

          key_path = '/tmp/oci_key.pem'

          config = {
              'user': os.environ['OCI_USER'],
              'tenancy': os.environ['OCI_TENANCY'],
              'fingerprint': os.environ['OCI_FINGERPRINT'],
              'region': os.environ['OCI_REGION'],
              'key_file': key_path
          }

          # --- Notificacao opcional (Discord webhook) ---
          # Se o secret NOTIFY_WEBHOOK nao existir, simplesmente nao notifica.
          # Uma falha ao notificar NUNCA derruba o script.
          def notify(text):
              url = os.environ.get('NOTIFY_WEBHOOK', '').strip()
              if not url:
                  return
              try:
                  data = json.dumps({'content': text}).encode('utf-8')
                  req = urllib.request.Request(
                      url, data=data, headers={'Content-Type': 'application/json'}
                  )
                  urllib.request.urlopen(req, timeout=10)
                  print('  (notificacao enviada)', flush=True)
              except Exception as ne:
                  print(f'  (falha ao notificar: {type(ne).__name__})', flush=True)

          compute = oci.core.ComputeClient(config)
          ssh_key = os.environ['OCI_SSH_PUBKEY'].strip()
          compartment_id = os.environ['OCI_TENANCY']

          print('Buscando image Ubuntu 22.04...', flush=True)
          images = compute.list_images(
              compartment_id=compartment_id,
              operating_system='Canonical Ubuntu',
              operating_system_version='22.04',
              shape='VM.Standard.A1.Flex'
          ).data

          if not images:
              print('Nenhuma image Ubuntu 22.04 encontrada!')
              notify('ERRO oci-retry: nenhuma image Ubuntu 22.04 encontrada (config errada?)')
              sys.exit(1)

          image_id = images[0].id
          print(f'Image encontrada: {images[0].display_name} ({image_id})', flush=True)

          def instancia_ja_existe():
              try:
                  instances = compute.list_instances(compartment_id=compartment_id).data
                  for i in instances:
                      if i.display_name == 'vm-n8n' and i.lifecycle_state not in ['TERMINATED', 'TERMINATING']:
                          return True, i.id
                  return False, None
              except Exception as e:
                  print(f'  Erro ao verificar instancias: {e}', flush=True)
                  return False, None

          existe, ocid = instancia_ja_existe()
          if existe:
              print(f'Instancia vm-n8n ja existe! OCID: {ocid}')
              notify(f'VM vm-n8n JA EXISTE. OCID: {ocid} -- pode DESATIVAR o workflow.')
              sys.exit(0)

          details = oci.core.models.LaunchInstanceDetails(
              availability_domain='oVqo:SA-SAOPAULO-1-AD-1',
              compartment_id=compartment_id,
              shape='VM.Standard.A1.Flex',
              shape_config=oci.core.models.LaunchInstanceShapeConfigDetails(ocpus=4, memory_in_gbs=24),
              subnet_id='ocid1.subnet.oc1.sa-saopaulo-1.aaaaaaaar32rtcz2tde3n67zho6a7ueleiueb2jpz27fympaqvpqgdyemr7a',
              image_id=image_id,
              metadata={'ssh_authorized_keys': ssh_key},
              display_name='vm-n8n'
          )

          tentativa = 0
          while True:
              tentativa += 1
              agora = datetime.datetime.now().strftime('%H:%M:%S')
              print(f'[{agora}] Tentativa {tentativa}...', flush=True)

              if tentativa % 10 == 0:
                  existe, ocid = instancia_ja_existe()
                  if existe:
                      print(f'Instancia criada por outra execucao! OCID: {ocid}')
                      notify(f'VM vm-n8n criada (detectada na verificacao periodica). OCID: {ocid} -- DESATIVE o workflow.')
                      sys.exit(0)

              try:
                  response = compute.launch_instance(details)
                  ocid = response.data.id
                  print('SUCESSO! Instancia criada!', flush=True)
                  print('OCID:', ocid, flush=True)
                  notify(f'SUCESSO! VM vm-n8n criada! OCID: {ocid} -- pegue o IP no painel da Oracle e DESATIVE o workflow.')
                  sys.exit(0)

              except oci.exceptions.ServiceError as e:
                  msg = str(e)

                  # 1) SEM CAPACIDADE: erro esperado/normal -> continua tentando pra sempre.
                  if 'Out of host capacity' in msg or e.status in (429, 500):
                      print('  Sem capacidade. Aguardando 30s...', flush=True)
                      time.sleep(30)

                  # 2) LIMITE/QUOTA ou JA EXISTE: confirma se a VM ja foi criada.
                  elif e.code in ('LimitExceeded', 'QuotaExceeded') or 'already exists' in msg.lower():
                      existe, ocid = instancia_ja_existe()
                      if existe:
                          print(f'Instancia ja existe! OCID: {ocid}', flush=True)
                          notify(f'VM vm-n8n ja existe! OCID: {ocid} -- DESATIVE o workflow.')
                          sys.exit(0)
                      print(f'  ERRO de limite/quota: status={e.status} code={e.code} msg={e.message}', flush=True)
                      time.sleep(30)

                  # 3) ERRO FATAL (credencial/config): repetir nao adianta -> PARA e AVISA.
                  #    Ex: 401 auth, 403 sem permissao, 400 request invalido, 404 recurso inexistente.
                  elif e.status in (400, 401, 403, 404):
                      existe, ocid = instancia_ja_existe()
                      if existe:
                          notify(f'VM vm-n8n ja existe! OCID: {ocid} -- DESATIVE o workflow.')
                          sys.exit(0)
                      print(f'  ERRO FATAL status={e.status} code={e.code} msg={e.message}', flush=True)
                      notify(f'ERRO FATAL no oci-retry: status={e.status} code={e.code} msg={e.message} -- precisa de atencao manual.')
                      sys.exit(1)

                  # 4) Qualquer outro ServiceError: trata como transitorio e continua.
                  else:
                      print(f'  ERRO status={e.status} code={e.code} msg={e.message}', flush=True)
                      time.sleep(30)

              except Exception as e:
                  # Soluco de rede. Pode ser que a VM tenha sido criada mas a resposta caiu:
                  # confirma a existencia ANTES de tentar de novo (fecha a janela de duplicata).
                  print(f'  Erro de conexao, verificando se criou... {type(e).__name__}', flush=True)
                  existe, ocid = instancia_ja_existe()
                  if existe:
                      print(f'Instancia detectada apos erro de conexao! OCID: {ocid}', flush=True)
                      notify(f'VM vm-n8n criada (detectada apos erro de conexao). OCID: {ocid} -- DESATIVE o workflow.')
                      sys.exit(0)
                  time.sleep(30)
          EOF
