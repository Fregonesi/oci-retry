name: OCI Instance Retry

on:
  schedule:
    # A cada 30 min -> ~48 runs/dia x ~1 min = ~1440 min/mes (dentro dos 2000 do repo privado).
    # Se deixar o repo PUBLICO, os minutos de Actions sao ilimitados -> pode usar '*/5 * * * *' a vontade.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Evita que duas execucoes rodem ao mesmo tempo (e martelem a API a toa).
concurrency:
  group: oci-retry
  cancel-in-progress: false

jobs:
  try-create:
    runs-on: ubuntu-latest
    timeout-minutes: 5          # tentativa CURTA -> economiza minutos
    steps:
      - name: Install OCI SDK
        run: pip install oci

      - name: Write key file
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          # %b interpreta os \n escapados do secret e gera as quebras de linha REAIS
          # do PEM. Funciona tanto pra secret em 1 linha (com \n) quanto multilinha.
          printf '%b' "$OCI_PRIVATE_KEY" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
          head -1 /tmp/oci_key.pem

      - name: Try to create instance
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SSH_PUBKEY: ${{ secrets.OCI_SSH_PUBKEY }}
        run: |
          python - <<'EOF'
          import oci, os, sys, datetime

          config = {
              'user': os.environ['OCI_USER'],
              'tenancy': os.environ['OCI_TENANCY'],
              'fingerprint': os.environ['OCI_FINGERPRINT'],
              'region': os.environ['OCI_REGION'],
              'key_file': '/tmp/oci_key.pem',
          }

          # Valida credenciais ANTES de qualquer chamada -> erro de auth aparece claro.
          try:
              oci.config.validate_config(config)
          except Exception as e:
              print(f'Config invalida: {e}', flush=True)
              sys.exit(1)

          compute = oci.core.ComputeClient(config)
          compartment_id = os.environ['OCI_TENANCY']
          ssh_key = os.environ['OCI_SSH_PUBKEY'].strip()
          agora = datetime.datetime.now().strftime('%H:%M:%S')

          # list_images dentro de try/except: se falhar aqui eh auth/permissao, NAO capacidade.
          try:
              images = compute.list_images(
                  compartment_id=compartment_id,
                  operating_system='Canonical Ubuntu',
                  operating_system_version='22.04',
                  shape='VM.Standard.A1.Flex',
              ).data
          except oci.exceptions.ServiceError as e:
              print(f'Falha ao listar images (auth/permissao?): status={e.status} code={e.code} msg={e.message}', flush=True)
              sys.exit(1)

          if not images:
              print('Nenhuma image Ubuntu 22.04 encontrada!', flush=True)
              sys.exit(1)

          image_id = images[0].id
          print(f'Image: {images[0].display_name}', flush=True)

          # Ja existe a instancia?
          try:
              instances = compute.list_instances(compartment_id=compartment_id).data
          except oci.exceptions.ServiceError as e:
              print(f'Falha ao listar instancias: status={e.status} code={e.code} msg={e.message}', flush=True)
              sys.exit(1)

          for i in instances:
              if i.display_name == 'vm-n8n' and i.lifecycle_state not in ('TERMINATED', 'TERMINATING'):
                  print(f'Instancia vm-n8n ja existe! OCID: {i.id}', flush=True)
                  sys.exit(0)

          details = oci.core.models.LaunchInstanceDetails(
              availability_domain='oVqo:SA-SAOPAULO-1-AD-1',
              compartment_id=compartment_id,
              shape='VM.Standard.A1.Flex',
              shape_config=oci.core.models.LaunchInstanceShapeConfigDetails(ocpus=4, memory_in_gbs=24),
              subnet_id='ocid1.subnet.oc1.sa-saopaulo-1.aaaaaaaar32rtcz2tde3n67zho6a7ueleiueb2jpz27fympaqvpqgdyemr7a',
              image_id=image_id,
              metadata={'ssh_authorized_keys': ssh_key},
              display_name='vm-n8n',
          )

          # UMA tentativa por execucao -> sai rapido, gasta pouco minuto.
          try:
              resp = compute.launch_instance(details)
              print(f'[{agora}] SUCESSO! Instancia criada. OCID: {resp.data.id}', flush=True)
              sys.exit(0)   # <- sai de verdade (sem o bug do raise sendo capturado)
          except oci.exceptions.ServiceError as e:
              msg = str(e)
              if 'Out of host capacity' in msg or e.status in (429, 500):
                  # Esperado: capacidade indisponivel. Sai LIMPO (run verde) e tenta no proximo ciclo.
                  print(f'[{agora}] Sem capacidade ainda (status={e.status} code={e.code}). Tento no proximo ciclo.', flush=True)
                  sys.exit(0)
              # Erro de verdade (config, permissao, subnet errada, etc.) -> falha VERMELHA pra voce ver.
              print(f'[{agora}] ERRO real: status={e.status} code={e.code} msg={e.message}', flush=True)
              sys.exit(1)
          EOF
