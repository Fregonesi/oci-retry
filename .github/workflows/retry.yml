name: OCI Instance Retry

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  try-create:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install OCI SDK
        run: pip install oci

