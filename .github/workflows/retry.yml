          chmod 600 /tmp/oci_key.pem

      - name: Try to create instance
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SSH_PUBKEY: ${{ secrets.OCI_SSH_PUBKEY }}
        run: |
          python - <<'EOF'
          import oci, os, sys, time, datetime

          key_path = '/tmp/oci_key.pem'

          config = {
              'user': os.environ['OCI_USER'],
              'tenancy': os.environ['OCI_TENANCY'],
              'fingerprint': os.environ['OCI_FINGERPRINT'],
              'region': os.environ['OCI_REGION'],
              'key_file': key_path
          }

          compute = oci.core.ComputeClient(config)
          ssh_key = os.environ['OCI_SSH_PUBKEY'].strip()
          compartment_id = os.environ['OCI_TENANCY']

          def instancia_ja_existe():
              try:
                  instances = compute.list_instances(compartment_id=compartment_id).data
                  for i in instances:
                      if i.display_name == 'vm-n8n' and i.lifecycle_state not in ['TERMINATED', 'TERMINATING']:
                          return True, i.id
                  return False, None
              except Exception as e:
                  print(f'  Erro ao verificar instancias: {e}', flush=True)
                  return False, None

          existe, ocid = instancia_ja_existe()
          if existe:
              print(f'Instancia vm-n8n ja existe! OCID: {ocid}')
              sys.exit(0)

          details = oci.core.models.LaunchInstanceDetails(
              availability_domain='oVqo:SA-SAOPAULO-1-AD-1',
              compartment_id=compartment_id,
              shape='VM.Standard.A1.Flex',
              shape_config=oci.core.models.LaunchInstanceShapeConfigDetails(ocpus=4, memory_in_gbs=24),
              subnet_id='ocid1.subnet.oc1.sa-saopaulo-1.aaaaaaaaw6x6x676dnh7dyypqindcrb56rbqqt7vtxrhyicp32dvwbstwnza',
              image_id='ocid1.image.oc1.sa-saopaulo-1.aaaaaaaaemf52b7af7ncncxz6pdc6hrlkdmylvwejfzpwnpbuhlfxwhrno6a',
              metadata={'ssh_authorized_keys': ssh_key},
              display_name='vm-n8n'
          )

          tentativa = 0
          while True:
              tentativa += 1
              agora = datetime.datetime.now().strftime('%H:%M:%S')
              print(f'[{agora}] Tentativa {tentativa}...', flush=True)

              if tentativa % 10 == 0:
                  existe, ocid = instancia_ja_existe()
                  if existe:
                      print(f'Instancia criada por outra execucao! OCID: {ocid}')
                      sys.exit(0)

              try:
                  response = compute.launch_instance(details)
                  print('SUCESSO! Instancia criada!')
                  print('OCID:', response.data.id)
                  raise Exception('INSTANCIA CRIADA COM SUCESSO - OCID: ' + response.data.id)
              except oci.exceptions.ServiceError as e:
                  if 'Out of host capacity' in str(e):
                      print(f'  Sem capacidade. Aguardando 30s...', flush=True)
                      time.sleep(30)
                  else:
                      print(f'  ERRO: {e.message}', flush=True)
                      time.sleep(30)
          EOF
